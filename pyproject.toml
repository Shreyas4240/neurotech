[project]
name = "digi-bci"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "mne>=1.6",
    "pylsl>=1.16",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "websockets>=12.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "aiofiles>=23.0",
]

[tool.vercel]
entrypoint = "brain_replica.main:app"
